<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Grid Widget Builder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
        }

        /* The grid container occupying the full screen */
        #grid-container {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100vw;
            height: 100vh;
            position: relative;
            user-select: none;
        }

        /* Individual grid cell dimensions: screen / (16 * 6) */
        .grid-cell {
            border: 1px solid rgba(255, 255, 255, 0.05);
            background-color: #1e293b;
            transition: background-color 0.15s ease;
            cursor: crosshair;
        }

        .grid-cell.selecting {
            background-color: #3b82f6;
            opacity: 0.6;
        }

        /* The merged widget container */
        .widget-box {
            position: absolute;
            background: #1e293b;
            border: 2px dashed #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            padding: 10px;
        }

        /* Prompt Form UI overlay inside the box */
        .prompt-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #334155;
            z-index: 10;
        }

        .prompt-input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #fff;
            font-size: 14px;
        }

        .prompt-input:focus {
            outline: 2px solid #3b82f6;
        }

        .prompt-submit {
            padding: 8px 16px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .prompt-submit:hover {
            background: #2563eb;
        }

        /* Widget inner frame sandbox */
        .widget-content {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        .loading {
            color: #94a3b8;
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div id="grid-container"></div>

    <script>
        const COLS = 16;
        const ROWS = 6;
        const container = document.getElementById('grid-container');
        
        let isDrawing = false;
        let startCell = null;
        
        // Build the 16x6 grid dynamically
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.classList.add('grid-cell');
                cell.dataset.row = r;
                cell.dataset.col = c;
                
                cell.addEventListener('mousedown', (e) => startSelection(e, cell));
                cell.addEventListener('mouseenter', () => updateSelection(cell));
                
                container.appendChild(cell);
            }
        }

        window.addEventListener('mouseup', endSelection);

        function startSelection(e, cell) {
            isDrawing = true;
            startCell = { row: parseInt(cell.dataset.row), col: parseInt(cell.dataset.col) };
            clearSelection();
            cell.classList.add('selecting');
        }

        function updateSelection(cell) {
            if (!isDrawing) return;
            
            clearSelection();
            const currentCell = { row: parseInt(cell.dataset.row), col: parseInt(cell.dataset.col) };
            
            const [minR, maxR, minC, maxC] = getBoundingBox(startCell, currentCell);
            
            for (let r = minR; r <= maxR; r++) {
                for (let c = minC; c <= maxC; c++) {
                    const target = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                    if (target) target.classList.add('selecting');
                }
            }
        }

        function endSelection() {
            if (!isDrawing) return;
            isDrawing = false;
            
            const selectedCells = document.querySelectorAll('.grid-cell.selecting');
            if (selectedCells.length === 0) return;

            // Compute actual coordinates based on screen sizes
            const rects = Array.from(selectedCells).map(c => c.getBoundingClientRect());
            const top = Math.min(...rects.map(r => r.top));
            const left = Math.min(...rects.map(r => r.left));
            const bottom = Math.max(...rects.map(r => r.bottom));
            const right = Math.max(...rects.map(r => r.right));
            
            const width = right - left;
            const height = bottom - top;

            createWidgetBox(top, left, width, height);
            clearSelection();
        }

        function getBoundingBox(cellA, cellB) {
            return [
                Math.min(cellA.row, cellB.row),
                Math.max(cellA.row, cellB.row),
                Math.min(cellA.col, cellB.col),
                Math.max(cellA.col, cellB.col)
            ];
        }

        function clearSelection() {
            document.querySelectorAll('.grid-cell.selecting').forEach(c => c.classList.remove('selecting'));
        }

        function createWidgetBox(top, left, width, height) {
            const widgetBox = document.createElement('div');
            widgetBox.classList.add('widget-box');
            widgetBox.style.top = `${top}px`;
            widgetBox.style.left = `${left}px`;
            widgetBox.style.width = `${width}px`;
            widgetBox.style.height = `${height}px`;

            // Prompt box inside the middle of the selected area
            const promptContainer = document.createElement('div');
            promptContainer.classList.add('prompt-container');
            
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'e.g., A widget box that shows current time';
            input.classList.add('prompt-input');

            const button = document.createElement('button');
            button.innerText = 'Generate';
            button.classList.add('prompt-submit');

            promptContainer.appendChild(input);
            promptContainer.appendChild(button);
            widgetBox.appendChild(promptContainer);
            container.appendChild(widgetBox);

            button.addEventListener('click', () => {
                const promptValue = input.value.trim();
                if (!promptValue) return;

                // Shift to loading state
                promptContainer.innerHTML = '<div class="loading">Generating your widget...</div>';

                fetch('/generate-widget', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptValue })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        promptContainer.innerHTML = `<div style="color: #ef4444;">Error: ${data.error}</div>`;
                        return;
                    }
                    
                    // Render the sandbox iframe inside the widget box area
                    widgetBox.innerHTML = '';
                    const iframe = document.createElement('iframe');
                    iframe.classList.add('widget-content');
                    widgetBox.appendChild(iframe);
                    
                    const doc = iframe.contentWindow.document;
                    doc.open();
                    doc.write(data.html);
                    doc.close();
                })
                .catch(err => {
                    promptContainer.innerHTML = `<div style="color: #ef4444;">Failed to connect to backend.</div>`;
                });
            });
        }
    </script>
</body>
</html>
